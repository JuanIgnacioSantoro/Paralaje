<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias de Vida - Paralaje Mouse</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #parallax-viewport {
            position: relative;
            height: 100vh; 
            aspect-ratio: 9 / 16; 
            perspective: 1200px;
            overflow: hidden;
            border: 2px solid #333;
        }

        .layer {
            position: absolute;
            top: 50%;
            left: 50%;
            background-size: auto 110vh; /* Un poco más grande para evitar bordes */
            background-position: center;
            background-repeat: no-repeat;
            width: 120%; /* Ancho extra para el desplazamiento */
            height: 120%;
            will-change: transform;
            /* Suaviza el movimiento para que no sea brusco */
            transition: transform 0.1s ease-out; 
        }

        .layer-bg { background-image: url('capa_fondo.png'); z-index: 1; }
        .layer-mid { background-image: url('capa_medio.png'); z-index: 2; }
        .layer-fg { background-image: url('capa_frente.png'); z-index: 3; }
    </style>
</head>
<body>

    <div id="parallax-viewport">
        <div class="layer layer-bg" id="bg"></div>
        <div class="layer layer-mid" id="mid"></div>
        <div class="layer layer-fg" id="fg"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('parallax-viewport');
            const layers = [
                { el: document.getElementById('bg'), depth: 15 },  // Movimiento sutil
                { el: document.getElementById('mid'), depth: 40 }, // Movimiento medio
                { el: document.getElementById('fg'), depth: 80 }   // Movimiento fuerte
            ];

            window.addEventListener('mousemove', (e) => {
                // Calculamos la posición del mouse relativa al centro de la pantalla
                // El resultado irá de -0.5 a 0.5 aproximadamente
                const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

                layers.forEach(layer => {
                    // Multiplicamos la posición por la profundidad (depth) de cada capa
                    const moveX = x * layer.depth;
                    const moveY = y * layer.depth;
                    
                    // Aplicamos el desplazamiento manteniendo el centrado (-50%)
                    // Usamos un scale de 1.2 para que haya margen de imagen en los bordes
                    layer.el.style.transform = `translate(calc(-50% + ${-moveX}px), calc(-50% + ${-moveY}px)) scale(1.2)`;
                });
            });
        });
    </script>
</body>
</html>
